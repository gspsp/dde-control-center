name: Build dde-control-center deb on Deepin

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  container:
    runs-on: ubuntu-latest
    container: linuxdeepin/deepin:crimson
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euxo pipefail

          # Configure deepin crimson repository
          echo "deb [trusted=yes] http://mirrors.kernel.org/deepin/beige/ crimson main commercial community" > /etc/apt/sources.list
          echo "deb-src [trusted=yes] http://mirrors.kernel.org/deepin/beige/ crimson main commercial community" >> /etc/apt/sources.list
          rm -rf /etc/apt/sources.list.d

          apt-get update
          apt-get install -y devscripts equivs git

          # Save the project workspace directory
          PROJECT_DIR="$PWD"
          echo "Project workspace directory: $PROJECT_DIR"

          # Install wlr-protocols package directly (ignore auth for this one operation)
          apt-get install -y --allow-unauthenticated wlr-protocols || true

          # Build and install treeland-protocols from source (required build dependency not from repo)
          echo "Building treeland-protocols from source (master)"
          cd /tmp
          if [ ! -d treeland-protocols ]; then
            git clone --depth=1 --branch master --single-branch https://github.com/linuxdeepin/treeland-protocols.git
          fi
          cd treeland-protocols
          mk-build-deps --install --remove --tool='apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends --yes' debian/control
          dpkg-buildpackage -uc -us -b
          apt-get install -y ../*.deb || dpkg -i ../*.deb || apt-get -f install -y
          cd "$PROJECT_DIR"

          # Build and install libdde-shell-dev from source if not available
          set +e
          dpkg-checkbuilddeps debian/control 2> /tmp/dcc-checkdeps.err
          CHECKDEPS_RC=$?
          set -e

          if [ "$CHECKDEPS_RC" -ne 0 ]; then
            echo "Analyzing missing packages..."
            cat /tmp/dcc-checkdeps.err

            # Try to build libdde-shell-dev from source if missing
            if grep -q "libdde-shell-dev" /tmp/dcc-checkdeps.err; then
              echo "libdde-shell-dev unavailable, building dde-shell from source"
              cd /tmp
              if [ ! -d dde-shell ]; then
                git clone --depth=1 https://github.com/linuxdeepin/dde-shell.git
              fi
              cd dde-shell
              mk-build-deps --install --remove --tool='apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends --yes' debian/control
              rm -f debian/*.postinst debian/*.postrm debian/*.prerm || true
              dpkg-buildpackage -uc -us -b
              dpkg -i --force-all ../*.deb || apt-get install -y -f ../*.deb || true
              echo "dde-shell packages installed"
              cd "$PROJECT_DIR"

              # Remove libdde-shell-dev version constraint from debian/control
              perl -0777 -pe "s/\n\s*libdde-shell-dev[^,]*,\n/\n/" -i debian/control
            fi
          fi

          # Now install all build dependencies
          mk-build-deps --install --remove --tool='apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends --yes' debian/control

      - name: Build dde-control-center deb package
        run: |
          set -euxo pipefail

          # Relax version constraints for any problematic dependencies
          sed -i -E 's/(libdde-shell-dev)[[:space:]]*\([^)]*\)/\1/g' debian/control
          sed -i -E 's/(libdtk6gui-dev)[[:space:]]*\([^)]*\)/\1/g' debian/control

          # Check build dependencies
          set +e
          dpkg-checkbuilddeps 2> /tmp/dcc-builddeps.err
          BUILDDEPS_RC=$?
          set -e

          if [ "$BUILDDEPS_RC" -ne 0 ]; then
            echo "Build dependencies check failed. Missing packages:"
            cat /tmp/dcc-builddeps.err
          fi

          dpkg-buildpackage -uc -us -b
          echo "dde-control-center deb package built successfully!"
          ls -la ../

      - name: Collect deb artifacts
        run: |
          set -euxo pipefail
          mkdir -p dist
          mv ../*.deb dist/
          ls -la dist

      - name: Upload deb packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dde-control-center-deepin-deb-packages
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 30
